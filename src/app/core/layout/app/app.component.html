      <a routerLink="/">
        <img
          alt="MCI logo"
          height="60"
          width="60"
          ngSrc="/images/logo.svg"
          priority="1"
        >
      </a>

    </div>
    <button mat-button>Home</button>
    <button mat-button>Storia</button>
    <button mat-button>Parroci</button>
    <button mat-button>Pfarramt</button>
    <button mat-button>Galleria</button>
    <button mat-button>Contatti</button>
    <button mat-button>Calendario messe</button>
    <button mat-button>Notizie</button>
    <button mat-button>Carlo Acutis</button>

    </a>
    <a mat-icon-button routerLink="/">
      <mat-icon svgIcon="instagram"></mat-icon>
    </a>
  </div>
