<footer class="full-bleed width-container">
  <div class="content footer-content">
    <a routerLink="/" style="grid-area: logo">
      <img
        alt="MCI logo"
        height="100"
        width="100"
        ngSrc="/images/logo.svg"
        priority="1"
      >
    </a>
    <div style="grid-area: contacts" class="contacts">
      <h5>Contatti</h5>
      <div class="info-box">
        <div>Tel. 0821 513030</div>
        <div>Fax 0821 312718</div>
        <div>info@mci-augsburg.de</div>
      </div>
    </div>
    <div style="grid-area: location" class="location">
      <h5>Posizione</h5>
      <div class="info-box">
        <div>Kobelweg 1</div>
        <div>86156 Augsburg</div>
      </div>
    </div>
    <div style="grid-area: connected">
      <h3>Resta connesso</h3>
      <div class="social-media">
        <a mat-icon-button href="https://www.facebook.com/profile.php?id=61583487631617">
          <mat-icon svgIcon="facebook"></mat-icon>
        </a>
        <a mat-icon-button routerLink="/">
          <mat-icon svgIcon="instagram"></mat-icon>
        </a>
      </div>
    </div>
    <div style="grid-area: buttons">
      <button mat-button>Home</button>
      <button mat-button>Pfarramt</button>
      <button mat-button>Contatti</button>
      <button mat-button>Notizie</button>
    </div>
  </div>
</footer>
