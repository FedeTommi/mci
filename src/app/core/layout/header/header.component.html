<header class="width-container floating">
  <div #menu class="content menu" [class.compact]="isCompact()">
    <div class="logo">
      <a routerLink="/">
        <img
          alt="MCI logo"
          height="60"
          width="60"
          ngSrc="images/logo.svg"
          priority="1"
        >
      </a>

    </div>

    <button
      #menuToggle
      class="menu-toggle"
      type="button"
      mat-icon-button
      aria-controls="compact-navigation"
      aria-label="Apri menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="openMenu()"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>

    <nav
      id="header-navigation"
      class="navigation"
      aria-label="Navigazione principale"
    >
      @for (link of navigationLinks; track link.path) {
        <a [routerLink]="link.path" mat-button>{{ link.label }}</a>
      }
    </nav>

    <a class="social-link" mat-icon-button href="https://www.facebook.com/profile.php?id=61583487631617">
      <mat-icon svgIcon="facebook"></mat-icon>
    </a>
    <a class="social-link" mat-icon-button routerLink="/">
      <mat-icon svgIcon="instagram"></mat-icon>
    </a>
  </div>
</header>

<dialog
  #dialog
  id="compact-navigation"
  aria-label="Navigazione principale"
  (cancel)="cancelMenu($event)"
  (close)="menuClosed()"
  (pointerdown)="startSwipe($event)"
  (pointermove)="moveSwipe($event)"
  (pointerup)="endSwipe($event)"
  (pointercancel)="cancelSwipe()"
  (click)="dialogClick($event)"
>
  <div class="dialog-controls">
    <button
      class="close-toggle"
      type="button"
      mat-icon-button
      aria-label="Chiudi menu"
      autofocus
      (click)="closeMenu()"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>
  <div class="navigation-panel">
    <nav class="compact-navigation" aria-label="Navigazione principale">
      @for (link of navigationLinks; track link.path) {
        <a [routerLink]="link.path" mat-button>{{ link.label }}</a>
      }
    </nav>
  </div>
</dialog>
