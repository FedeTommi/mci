<header class="width-container floating" (keydown.escape)="closeMenu(menuToggle)">
  <div #menu class="content menu" [class.compact]="isCompact()">
    <div class="logo">
      <a routerLink="/">
        <img
          alt="MCI logo"
          height="60"
          width="60"
          ngSrc="images/logo.svg"
          priority="1"
        >
      </a>

    </div>

    <button
      #menuToggle
      class="menu-toggle"
      type="button"
      mat-icon-button
      aria-controls="header-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Chiudi menu' : 'Apri menu'"
      (click)="menuOpen.set(!menuOpen())"
    >
      <mat-icon aria-hidden="true">{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <nav
      id="header-navigation"
      class="navigation"
      aria-label="Navigazione principale"
      [class.open]="menuOpen()"
      (click)="closeMenu(menuToggle)"
    >
      <a routerLink="home" mat-button>Home</a>
      <a routerLink="history" mat-button>Storia</a>
      <a routerLink="pastors" mat-button>Parroci</a>
      <a routerLink="parish-office" mat-button>Ufficio parrocchiale</a> <!-- Pfarramt-->
      <a routerLink="gallery" mat-button>Galleria</a>
      <a routerLink="contacts" mat-button>Contatti</a>
      <a routerLink="liturgical-calendar" mat-button>Calendario liturgico</a>
      <a routerLink="news" mat-button>Notizie</a>
      <a routerLink="carlo-acutis" mat-button>Carlo Acutis</a>
    </nav>

    <a class="social-link" mat-icon-button href="https://www.facebook.com/profile.php?id=61583487631617">
      <mat-icon svgIcon="facebook"></mat-icon>
    </a>
    <a class="social-link" mat-icon-button routerLink="/">
      <mat-icon svgIcon="instagram"></mat-icon>
    </a>
  </div>
</header>
